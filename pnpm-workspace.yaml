packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - '@isyuricunha/yutheme@0.1.3'
overrides:
  drizzle-kit: 0.31.10
  preact: 10.28.2
  js-yaml: ^4.1.1
  '@types/hast': ^3.0.5
packageExtensions:
  '@hookform/resolvers':
    peerDependencies:
      zod: ^3.25.0 || ^4.0.0
    peerDependenciesMeta:
      zod:
        optional: true

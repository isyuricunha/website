packages:
  - apps/*
  - packages/*
dedupePeerDependents: false
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - '@isyuricunha/yutheme@0.1.3 || 0.2.0 || 0.2.1'
  - eslint-plugin-sonarjs@4.2.3
overrides:
  drizzle-kit: 0.31.10
  preact: 10.28.2
  # Preserve the safeLoad API for legacy consumers; use patched releases per major.
  'js-yaml@>=3.0.0 <4.0.0': 3.15.2
  'js-yaml@>=4.0.0 <5.0.0': 4.3.2
  '@types/hast': ^3.0.5
  shell-quote: '>=1.11.0'
  esbuild: '>=0.28.1'
  postcss-selector-parser: '>=7.1.6'
  'zod@>=4.0.0 <4.6.6': 4.6.7
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'serialize-javascript@>=7.0.0 <7.1.3': 7.1.3
  # mdx-bundler 10.1.1 still pins vulnerable majors; keep these overrides scoped.
  'mdx-bundler@10.1.1>uuid': 11.1.1
  'mdx-bundler@10.1.1>remark-mdx-frontmatter': 6.0.0
  # Align testing-library's TypeScript ESLint dependencies with the workspace.
  'eslint-plugin-testing-library@7.16.3>@typescript-eslint/utils': 8.74.0
  'eslint-plugin-testing-library@7.16.3>@typescript-eslint/scope-manager': 8.74.0
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
peerDependencyRules:
  allowedVersions:
    eslint: '10'
packageExtensions:
  '@hookform/resolvers':
    peerDependencies:
      zod: ^3.25.0 || ^4.0.0
    peerDependenciesMeta:
      zod:
        optional: true

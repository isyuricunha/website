packages:
  - apps/*
  - packages/*
dedupePeerDependents: false
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - '@isyuricunha/yutheme@0.1.3 || 0.2.0 || 0.2.1'
overrides:
  drizzle-kit: 0.31.10
  preact: 10.28.2
  js-yaml: ^4.1.1
  '@types/hast': ^3.0.5
  shell-quote: '>=1.11.0'
  esbuild: '>=0.28.1'
  postcss-selector-parser: '>=7.1.6'
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
peerDependencyRules:
  allowedVersions:
    eslint: '10'
packageExtensions:
  '@hookform/resolvers':
    peerDependencies:
      zod: ^3.25.0 || ^4.0.0
    peerDependenciesMeta:
      zod:
        optional: true

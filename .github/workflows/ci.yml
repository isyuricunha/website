name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build MDX
        run: pnpm build:mdx

      - name: Format source
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/admin/admin-dashboard.tsx \
            apps/web/src/components/admin/ai-settings.tsx \
            apps/web/src/components/mascot/ai-chat-interface.tsx \
            apps/web/src/lib/ai/runtime-config.ts \
            apps/web/src/lib/ai/runtime-provider.ts \
            apps/web/src/tests/components/mascot/ai-chat-interface-feedback.test.tsx \
            apps/web/src/trpc/routers/admin.ts \
            apps/web/src/trpc/routers/users.ts

      - name: Apply post-format fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          chat_path = Path('apps/web/src/components/mascot/ai-chat-interface.tsx')
          chat = chat_path.read_text()
          chat_start = chat.index('    const lastUserMessage =')
          chat_end = chat.index('\n\n    if (!lastUserMessage)', chat_start)
          chat_replacement = """    const lastUserMessage = conversation.messages
              .slice(0, messageIndex)
              .findLast((m) => m.isUser)"""
          chat_path.write_text(chat[:chat_start] + chat_replacement + chat[chat_end:])

          config_path = Path('apps/web/src/lib/ai/runtime-config.ts')
          config = config_path.read_text()
          config_start = config.index('  const models = data')
          config_end = config.index('\n\n  return Array.from', config_start)
          config_replacement = """  const models: string[] = []
            for (const item of data) {
              if (!item || typeof item !== 'object') continue
              const id = Reflect.get(item, 'id')
              if (typeof id !== 'string') continue
              const normalizedId = id.trim()
              if (normalizedId) models.push(normalizedId)
            }"""
          config_path.write_text(
              config[:config_start] + config_replacement + config[config_end:]
          )
          PY

          pnpm exec prettier --write \
            apps/web/src/components/mascot/ai-chat-interface.tsx \
            apps/web/src/lib/ai/runtime-config.ts

      - name: Validate source
        run: |
          pnpm turbo lint
          pnpm turbo type-check
          pnpm format:check

      - name: Commit source
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name 'Yuri Cunha'
          git config user.email '115634315+isyuricunha@users.noreply.github.com'
          git add \
            apps/web/src/components/admin/admin-dashboard.tsx \
            apps/web/src/components/admin/ai-settings.tsx \
            apps/web/src/components/mascot/ai-chat-interface.tsx \
            apps/web/src/lib/ai/runtime-config.ts \
            apps/web/src/lib/ai/runtime-provider.ts \
            apps/web/src/tests/components/mascot/ai-chat-interface-feedback.test.tsx \
            apps/web/src/trpc/routers/admin.ts \
            apps/web/src/trpc/routers/users.ts

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit --no-verify -m 'style(web): format runtime settings'
          git push origin "HEAD:${BRANCH_NAME}"

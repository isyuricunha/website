name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build MDX
        run: pnpm build:mdx

      - name: Run unit tests
        run: pnpm test:unit

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build MDX
        run: pnpm build:mdx

      - name: Lint
        run: pnpm turbo lint

      - name: Type check
        run: pnpm turbo type-check

      - name: Format pending files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/admin/admin-dashboard.tsx \
            apps/web/src/components/admin/ai-settings.tsx \
            apps/web/src/components/mascot/ai-chat-interface.tsx \
            apps/web/src/lib/ai/runtime-config.ts \
            apps/web/src/lib/ai/runtime-provider.ts \
            apps/web/src/tests/components/mascot/ai-chat-interface-feedback.test.tsx \
            apps/web/src/trpc/routers/admin.ts \
            apps/web/src/trpc/routers/users.ts

      - name: Commit formatting
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            tests:
              name: Unit tests
              runs-on: ubuntu-latest
              steps:
                - name: Checkout branch
                  uses: actions/checkout@v4

                - name: Setup
                  uses: ./.github/actions/setup

                - name: Build MDX
                  run: pnpm build:mdx

                - name: Run unit tests
                  run: pnpm test:unit

            check:
              name: Check
              runs-on: ubuntu-latest
              steps:
                - name: Checkout branch
                  uses: actions/checkout@v4

                - name: Setup
                  uses: ./.github/actions/setup

                - name: Build MDX
                  run: pnpm build:mdx

                - name: Lint
                  run: pnpm turbo lint

                - name: Type check
                  run: pnpm turbo type-check

                - name: Check formatting
                  run: pnpm format:check

                - name: Check spelling
                  run: pnpm check:spelling

            knip:
              name: Knip
              runs-on: ubuntu-latest
              steps:
                - name: Checkout branch
                  uses: actions/checkout@v4

                - name: Setup
                  uses: ./.github/actions/setup

                - name: Build MDX
                  run: pnpm build:mdx

                - name: Run knip
                  run: pnpm check:knip
          EOF

          pnpm exec prettier --write .github/workflows/ci.yml

          git config user.name 'Yuri Cunha'
          git config user.email '115634315+isyuricunha@users.noreply.github.com'
          git add \
            .github/workflows/ci.yml \
            apps/web/src/components/admin/admin-dashboard.tsx \
            apps/web/src/components/admin/ai-settings.tsx \
            apps/web/src/components/mascot/ai-chat-interface.tsx \
            apps/web/src/lib/ai/runtime-config.ts \
            apps/web/src/lib/ai/runtime-provider.ts \
            apps/web/src/tests/components/mascot/ai-chat-interface-feedback.test.tsx \
            apps/web/src/trpc/routers/admin.ts \
            apps/web/src/trpc/routers/users.ts

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'style(web): format runtime settings'
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Check formatting
        run: pnpm format:check

      - name: Check spelling
        run: pnpm check:spelling

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build MDX
        run: pnpm build:mdx

      - name: Run knip
        run: pnpm check:knip

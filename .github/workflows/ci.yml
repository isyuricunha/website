name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build MDX
        run: pnpm build:mdx

      - name: Run unit tests
        run: pnpm test:unit

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build MDX
        run: pnpm build:mdx

      - name: Lint
        run: pnpm turbo lint

      - name: Type check
        run: |
          set -o pipefail
          pnpm turbo type-check 2>&1 | tee type-check.log

      - name: Upload type-check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: type-check-log
          path: type-check.log
          if-no-files-found: error
          retention-days: 1

      - name: Format pending files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/admin/admin-dashboard.tsx \
            apps/web/src/components/admin/ai-settings.tsx \
            apps/web/src/components/mascot/ai-chat-interface.tsx \
            apps/web/src/lib/ai/runtime-config.ts \
            apps/web/src/lib/ai/runtime-provider.ts \
            apps/web/src/tests/components/mascot/ai-chat-interface-feedback.test.tsx \
            apps/web/src/trpc/routers/admin.ts \
            apps/web/src/trpc/routers/users.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            apps/web/src/components/admin/admin-dashboard.tsx
            apps/web/src/components/admin/ai-settings.tsx
            apps/web/src/components/mascot/ai-chat-interface.tsx
            apps/web/src/lib/ai/runtime-config.ts
            apps/web/src/lib/ai/runtime-provider.ts
            apps/web/src/tests/components/mascot/ai-chat-interface-feedback.test.tsx
            apps/web/src/trpc/routers/admin.ts
            apps/web/src/trpc/routers/users.ts
          if-no-files-found: error
          retention-days: 1

      - name: Check formatting
        run: pnpm format:check

      - name: Check spelling
        run: pnpm check:spelling

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build MDX
        run: pnpm build:mdx

      - name: Run knip
        run: pnpm check:knip

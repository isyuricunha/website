name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build MDX
        run: pnpm build:mdx

      - name: Run unit tests
        run: pnpm test:unit

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build MDX
        run: pnpm build:mdx

      - name: Format pending files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/admin/admin-dashboard.tsx \
            apps/web/src/components/admin/ai-settings.tsx \
            apps/web/src/components/mascot/ai-chat-interface.tsx \
            apps/web/src/lib/ai/runtime-config.ts \
            apps/web/src/lib/ai/runtime-provider.ts \
            apps/web/src/tests/components/mascot/ai-chat-interface-feedback.test.tsx \
            apps/web/src/trpc/routers/admin.ts \
            apps/web/src/trpc/routers/users.ts

      - name: Apply post-format fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          chat_path = Path('apps/web/src/components/mascot/ai-chat-interface.tsx')
          chat = chat_path.read_text()
          chat_start = chat.index('    const lastUserMessage =')
          chat_end = chat.index('\n\n    if (!lastUserMessage)', chat_start)
          chat_replacement = """    const lastUserMessage = conversation.messages
              .slice(0, messageIndex)
              .findLast((m) => m.isUser)"""
          chat_path.write_text(chat[:chat_start] + chat_replacement + chat[chat_end:])

          config_path = Path('apps/web/src/lib/ai/runtime-config.ts')
          config = config_path.read_text()
          config_start = config.index('  const models = data')
          config_end = config.index('\n\n  return Array.from', config_start)
          config_replacement = """  const models: string[] = []
            for (const item of data) {
              if (!item || typeof item !== 'object') continue
              const id = Reflect.get(item, 'id')
              if (typeof id !== 'string') continue
              const normalizedId = id.trim()
              if (normalizedId) models.push(normalizedId)
            }"""
          config_path.write_text(
              config[:config_start] + config_replacement + config[config_end:]
          )
          PY

          pnpm exec prettier --write \
            apps/web/src/components/mascot/ai-chat-interface.tsx \
            apps/web/src/lib/ai/runtime-config.ts

      - name: Restore clean workflow
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            tests:
              name: Unit tests
              runs-on: ubuntu-latest
              steps:
                - name: Checkout branch
                  uses: actions/checkout@v4

                - name: Setup
                  uses: ./.github/actions/setup

                - name: Build MDX
                  run: pnpm build:mdx

                - name: Run unit tests
                  run: pnpm test:unit

            check:
              name: Check
              runs-on: ubuntu-latest
              steps:
                - name: Checkout branch
                  uses: actions/checkout@v4

                - name: Setup
                  uses: ./.github/actions/setup

                - name: Build MDX
                  run: pnpm build:mdx

                - name: Lint
                  run: pnpm turbo lint

                - name: Type check
                  run: pnpm turbo type-check

                - name: Check formatting
                  run: pnpm format:check

                - name: Check spelling
                  run: pnpm check:spelling

            knip:
              name: Knip
              runs-on: ubuntu-latest
              steps:
                - name: Checkout branch
                  uses: actions/checkout@v4

                - name: Setup
                  uses: ./.github/actions/setup

                - name: Build MDX
                  run: pnpm build:mdx

                - name: Run knip
                  run: pnpm check:knip
          EOF

          pnpm exec prettier --write .github/workflows/ci.yml

      - name: Validate final source
        run: |
          pnpm turbo lint
          pnpm turbo type-check
          pnpm format:check

      - name: Upload final source
        uses: actions/upload-artifact@v4
        with:
          name: final-runtime-settings-source
          path: |
            .github/workflows/ci.yml
            apps/web/src/components/admin/admin-dashboard.tsx
            apps/web/src/components/admin/ai-settings.tsx
            apps/web/src/components/mascot/ai-chat-interface.tsx
            apps/web/src/lib/ai/runtime-config.ts
            apps/web/src/lib/ai/runtime-provider.ts
            apps/web/src/tests/components/mascot/ai-chat-interface-feedback.test.tsx
            apps/web/src/trpc/routers/admin.ts
            apps/web/src/trpc/routers/users.ts
          if-no-files-found: error
          retention-days: 1

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build MDX
        run: pnpm build:mdx

      - name: Run knip
        run: pnpm check:knip
